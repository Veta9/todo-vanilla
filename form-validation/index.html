<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Валидация формы</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="form-container">
    <h2>Создать аккаунт</h2>
    
    
    <form class="form" id="registrationForm" method="post" novalidate data-js-form="">
      
      
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Введите имя (мин. 3 символа)"
          required 
          minlength="3"
        >
        <span class="error-message" id="usernameError" data-js-field-error="">Имя должно содержать не менее 3 символов.</span>
      </div>

   
      <div class="form-group">
        <label for="email">Электронная почта</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="example@mail.com"
          required
        >
        <span class="error-message" id="emailError" data-js-field-error="">Введите корректный адрес электронной почты.</span>
      </div>

    
      <div class="form-group">
        <label for="password">Пароль</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Минимум 6 символов, включая цифру"
          required
          minlength="6"
          pattern=".*[0-9].*"
        >
        <span class="error-message" id="passwordError" data-js-field-error="">Пароль должен быть от 6 символов и содержать хотя бы одну цифру.</span>
      </div>

  
      <div class="form-group">
        <label for="confirmPassword">Подтвердите пароль</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          placeholder="Повторите пароль"
          required
        >
        <span class="error-message" id="confirmPasswordError" data-js-field-error="">Пароли не совпадают.</span>
      </div>

   
      <div class="form-group checkbox-group">
        <input 
        type="checkbox" 
        id="agree" 
        name="agree" 
        required
      >
        <label for="agree">Я согласен с условиями использования</label>
        <span class="error-message" id="agreeError" data-js-field-error="">Необходимо ваше согласие.</span>
      </div>

      <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>
  </div>

</body>
</html>
